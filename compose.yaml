name: dispe-integrado

services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bd_dispe}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres_db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-bd_dispe}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      APP_DEBUG: ${APP_DEBUG:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      API_KEY: ${API_KEY:-}
      SQL_CONSOLE_KEY: ${SQL_CONSOLE_KEY:-}
      NACIONALIDAD_LOCAL: Boliviana
    ports:
      - "127.0.0.1:${API_PORT:-8081}:80"
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/var/www/html/docker/healthcheck.php"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
